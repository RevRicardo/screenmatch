<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenMatch - Busca de Séries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ScreenMatch</h1>
        <p>Seu guia de séries favorito!</p>
    </header>

    <main>
        <section class="search-section">
            <h2>Buscar Séries</h2>
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="Digite o título da série...">
                <button id="searchButton">Buscar</button>
            </div>
        </section>

        <section class="results-section">
            <h2>Resultados da Busca</h2>
            <div id="seriesList" class="series-container">
                <p>Nenhuma série encontrada ainda. Use a busca acima!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 ScreenMatch</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
